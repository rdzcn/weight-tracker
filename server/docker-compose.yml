services:
  backend:
    image: ${BACKEND_IMAGE:-weight-tracker-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weight-tracker-backend
    restart: always
    ports:
      - "127.0.0.1:4101:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/weight.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
